# API keys and other credentials Hermes reads from ~/.hermes/.env.
# Descriptions are shortened from the environment-variable reference.
# https://hermes-agent.nousresearch.com/docs/reference/environment-variables
# https://hermes-agent.nousresearch.com/docs/integrations/providers
# Chat-bot tokens live in gateways.yaml so the steps stay next to the fields.

secrets:
  - key: OPENROUTER_API_KEY
    secret: true
    title_en: OpenRouter API key
    title_th: คีย์ API ของ OpenRouter
    source: https://hermes-agent.nousresearch.com/docs/integrations/providers
    help_en: >
      Required for provider openrouter. Create a key at openrouter.ai and paste
      it here. Hermes reads OPENROUTER_API_KEY from ~/.hermes/.env. The wizard
      also stores it in the OS keyring (Secret Service) and sets the file mode
      to 0600. An alternative documented login is
      hermes auth add openrouter --type oauth, which stores a key in the
      credential pool instead of this field.
    help_th: >
      จำเป็นเมื่อผู้ให้บริการเป็น openrouter สร้างคีย์ที่ openrouter.ai แล้ววางที่นี่
      Hermes อ่าน OPENROUTER_API_KEY จาก ~/.hermes/.env ตัวช่วยยังเก็บในพวงกุญแจ
      ของระบบ (Secret Service) และตั้งสิทธิ์ไฟล์เป็น 0600 ทางเลือกในเอกสารคือ
      hermes auth add openrouter --type oauth ซึ่งเก็บคีย์ในคลังข้อมูลรับรอง
      แทนช่องนี้

  - key: OPENROUTER_BASE_URL
    secret: false
    title_en: OpenRouter base URL
    title_th: ที่อยู่ฐานของ OpenRouter
    help_en: >
      Optional. Overrides the OpenRouter-compatible base URL. Leave blank to
      use the default https://openrouter.ai/api/v1 endpoint that Hermes uses
      for OpenRouter. Set this only for a trusted compatible endpoint.
    help_th: >
      ไม่บังคับ ใช้แทนที่อยู่ฐานที่เข้ากันได้กับ OpenRouter เว้นว่างเพื่อใช้ค่าเริ่มต้น
      https://openrouter.ai/api/v1 ที่ Hermes ใช้กับ OpenRouter
      ตั้งค่านี้เฉพาะปลายทางที่ไว้ใจได้

  - key: DEEPSEEK_API_KEY
    secret: true
    optional: true
    title_en: DeepSeek API key (direct)
    title_th: คีย์ API ของ DeepSeek (ตรง)
    help_en: >
      Optional. Used only when model.provider is deepseek, which talks to
      platform.deepseek.com. The owner's OpenRouter path does not need this
      key. Direct DeepSeek and OpenRouter are different providers in the docs.
    help_th: >
      ไม่บังคับ ใช้เมื่อ model.provider เป็น deepseek ซึ่งเรียก platform.deepseek.com
      เส้นทาง OpenRouter ของเจ้าของเครื่องไม่ต้องใช้คีย์นี้ DeepSeek ตรงและ
      OpenRouter เป็นคนละผู้ให้บริการในเอกสาร

  - key: DEEPSEEK_BASE_URL
    secret: false
    optional: true
    title_en: DeepSeek base URL
    title_th: ที่อยู่ฐานของ DeepSeek
    help_en: Custom DeepSeek API base URL. Leave blank for the provider default (https://api.deepseek.com/v1 in the provider guide).
    help_th: ที่อยู่ฐานของ API DeepSeek เว้นว่างเพื่อใช้ค่าของผู้ให้บริการ (เอกสารผู้ให้บริการระบุ https://api.deepseek.com/v1)

  - key: ANTHROPIC_API_KEY
    secret: true
    optional: true
    title_en: Anthropic API key
    title_th: คีย์ API ของ Anthropic
    help_en: Anthropic Console API key (console.anthropic.com) for the native anthropic provider.
    help_th: คีย์จาก Anthropic Console (console.anthropic.com) สำหรับผู้ให้บริการ anthropic โดยตรง

  - key: OPENAI_API_KEY
    secret: true
    optional: true
    title_en: OpenAI API key
    title_th: คีย์ API ของ OpenAI
    help_en: >
      OpenAI API key for the openai-api provider, or the key for a custom
      OpenAI-compatible endpoint when OPENAI_BASE_URL is set. A key that starts
      with sk-or- counts as an OpenRouter key; put OpenRouter keys in
      OPENROUTER_API_KEY.
    help_th: >
      คีย์ OpenAI สำหรับผู้ให้บริการ openai-api หรือคีย์ของปลายทางที่เข้ากันได้กับ
      OpenAI เมื่อตั้ง OPENAI_BASE_URL คีย์ที่ขึ้นต้นด้วย sk-or- ถูกนับเป็นคีย์
      OpenRouter ให้ใส่คีย์ OpenRouter ใน OPENROUTER_API_KEY

  - key: OPENAI_BASE_URL
    secret: false
    optional: true
    title_en: OpenAI base URL
    title_th: ที่อยู่ฐานของ OpenAI
    help_en: Base URL for a custom OpenAI-compatible endpoint (vLLM, SGLang, and similar). Leave blank for the official OpenAI API.
    help_th: ที่อยู่ฐานของปลายทางที่เข้ากันได้กับ OpenAI (เช่น vLLM, SGLang) เว้นว่างสำหรับ API ทางการของ OpenAI

  - key: GEMINI_API_KEY
    secret: true
    optional: true
    title_en: Google AI Studio / Gemini key
    title_th: คีย์ Google AI Studio / Gemini
    help_en: Alias of GOOGLE_API_KEY. Google AI Studio key from aistudio.google.com/app/apikey.
    help_th: ชื่อเดียวกับ GOOGLE_API_KEY คีย์ Google AI Studio จาก aistudio.google.com/app/apikey

  - key: XAI_API_KEY
    secret: true
    optional: true
    title_en: xAI API key
    title_th: คีย์ API ของ xAI
    help_en: xAI (Grok) API key for chat, TTS, and web search (console.x.ai). Provider id is xai.
    help_th: คีย์ xAI (Grok) สำหรับแชท TTS และการค้นเว็บ (console.x.ai) รหัสผู้ให้บริการคือ xai

  - key: MINIMAX_API_KEY
    secret: true
    optional: true
    title_en: MiniMax API key
    title_th: คีย์ API ของ MiniMax
    help_en: MiniMax global endpoint key (minimax.io). Not used by the minimax-oauth browser login.
    help_th: คีย์ปลายทางสากลของ MiniMax (minimax.io) ไม่ได้ใช้กับการล็อกอินเบราว์เซอร์ minimax-oauth

  - key: NVIDIA_API_KEY
    secret: true
    optional: true
    title_en: NVIDIA API key
    title_th: คีย์ API ของ NVIDIA
    help_en: NVIDIA NIM API key for models on build.nvidia.com. Provider id is nvidia.
    help_th: คีย์ NVIDIA NIM สำหรับโมเดลบน build.nvidia.com รหัสผู้ให้บริการคือ nvidia

  - key: HF_TOKEN
    secret: true
    optional: true
    title_en: Hugging Face token
    title_th: โทเคน Hugging Face
    help_en: Hugging Face token for Inference Providers (huggingface.co/settings/tokens). Provider id is huggingface.
    help_th: โทเคน Hugging Face สำหรับ Inference Providers (huggingface.co/settings/tokens) รหัสผู้ให้บริการคือ huggingface

  - key: ELEVENLABS_API_KEY
    secret: true
    optional: true
    title_en: ElevenLabs API key
    title_th: คีย์ API ของ ElevenLabs
    help_en: ElevenLabs key used when tts.provider is elevenlabs.
    help_th: คีย์ ElevenLabs เมื่อตั้ง tts.provider เป็น elevenlabs

  - key: FIRECRAWL_API_KEY
    secret: true
    optional: true
    title_en: Firecrawl API key
    title_th: คีย์ API ของ Firecrawl
    help_en: Web search and extract backend firecrawl (firecrawl.dev). Optional when a self-hosted FIRECRAWL_API_URL is set.
    help_th: คีย์แบ็กเอนด์ค้นและดึงเว็บ firecrawl (firecrawl.dev) ไม่บังคับถ้าตั้ง FIRECRAWL_API_URL ของเซิร์ฟเวอร์ตัวเอง

  - key: FIRECRAWL_API_URL
    secret: false
    optional: true
    title_en: Firecrawl API URL
    title_th: ที่อยู่ API ของ Firecrawl
    help_en: Self-hosted Firecrawl endpoint. When this is set, the API key is optional.
    help_th: ปลายทาง Firecrawl ที่โฮสต์เอง เมื่อตั้งค่านี้ คีย์ API ไม่บังคับ

  - key: TAVILY_API_KEY
    secret: true
    optional: true
    title_en: Tavily API key
    title_th: คีย์ API ของ Tavily
    help_en: Optional Tavily key for higher search and extract limits. The docs say keyless access works after Tavily is selected as the web backend.
    help_th: คีย์ Tavily ไม่บังคับ สำหรับโควตาค้นและดึงที่สูงขึ้น เอกสารบอกว่าหลังเลือก Tavily เป็นแบ็กเอนด์เว็บ ใช้แบบไม่มีคีย์ได้

  - key: EXA_API_KEY
    secret: true
    optional: true
    title_en: Exa API key
    title_th: คีย์ API ของ Exa
    help_en: Exa key for the exa web backend (exa.ai). A keyless free tier also exists.
    help_th: คีย์ Exa สำหรับแบ็กเอนด์เว็บ exa (exa.ai) มีชั้นฟรีแบบไม่มีคีย์ด้วย

  - key: PERPLEXITY_API_KEY
    secret: true
    optional: true
    title_en: Perplexity API key
    title_th: คีย์ API ของ Perplexity
    help_en: Perplexity Search API key for the perplexity web backend.
    help_th: คีย์ Perplexity Search สำหรับแบ็กเอนด์เว็บ perplexity

  - key: SEARXNG_URL
    secret: false
    optional: true
    title_en: SearXNG URL
    title_th: ที่อยู่ SearXNG
    help_en: URL of a SearXNG instance for keyless self-hosted web search. Search only; extract needs another backend.
    help_th: ที่อยู่เซิร์ฟเวอร์ SearXNG สำหรับค้นเว็บแบบโฮสต์เองโดยไม่มีคีย์ ใช้ค้นได้อย่างเดียว การดึงหน้าต้องใช้แบ็กเอนด์อื่น

  - key: HERMES_TIMEZONE
    secret: false
    optional: true
    title_en: Timezone environment override
    title_th: ไทม์โซนผ่านตัวแปรสภาพแวดล้อม
    help_en: >
      Optional. HERMES_TIMEZONE overrides the timezone key in config.yaml.
      Use an IANA name such as Asia/Bangkok. Leave blank to keep the config.yaml
      value. The config page writes timezone; set this only when you want the
      env var to win.
    help_th: >
      ไม่บังคับ HERMES_TIMEZONE ทับคีย์ timezone ใน config.yaml
      ใช้ชื่อ IANA เช่น Asia/Bangkok เว้นว่างเพื่อใช้ค่าใน config.yaml
      หน้าตั้งค่าเขียนคีย์ timezone ให้ตั้งช่องนี้เมื่อต้องการให้ตัวแปรสภาพแวดล้อมชนะ

field_meta:
  OPENROUTER_API_KEY:
    example: sk-or-v1-...
    where_en: openrouter.ai → Keys → Create. The Provider page is the easier place to paste this.
    where_th: openrouter.ai → Keys → Create หน้าผู้ให้บริการเป็นที่วางคีย์นี้ที่ง่ายกว่า
    links:
      - label_en: OpenRouter keys
        label_th: หน้าคีย์ OpenRouter
        url: https://openrouter.ai/keys
  OPENROUTER_BASE_URL:
    example: https://openrouter.ai/api/v1
    where_en: Leave blank for the normal OpenRouter endpoint. Fill only a trusted compatible base URL.
    where_th: เว้นว่างสำหรับปลายทาง OpenRouter ปกติ ใส่เฉพาะที่อยู่ฐานที่ไว้ใจได้และเข้ากันได้
  DEEPSEEK_API_KEY:
    example: sk-...
    where_en: platform.deepseek.com API keys. Not the OpenRouter key.
    where_th: คีย์ API ที่ platform.deepseek.com ไม่ใช่คีย์ OpenRouter
    links:
      - label_en: DeepSeek keys
        label_th: หน้าคีย์ DeepSeek
        url: https://platform.deepseek.com/api_keys
  ANTHROPIC_API_KEY:
    example: sk-ant-...
    where_en: console.anthropic.com → API keys.
    where_th: console.anthropic.com → API keys
    links:
      - label_en: Anthropic keys
        label_th: หน้าคีย์ Anthropic
        url: https://console.anthropic.com/settings/keys
  OPENAI_API_KEY:
    example: sk-...
    where_en: platform.openai.com → API keys. Do not paste an sk-or- key here.
    where_th: platform.openai.com → API keys อย่าวางคีย์ที่ขึ้นต้น sk-or- ที่นี่
    links:
      - label_en: OpenAI keys
        label_th: หน้าคีย์ OpenAI
        url: https://platform.openai.com/api-keys
  GEMINI_API_KEY:
    example: AIza...
    where_en: Google AI Studio → Get API key.
    where_th: Google AI Studio → Get API key
    links:
      - label_en: Google AI Studio
        label_th: Google AI Studio
        url: https://aistudio.google.com/app/apikey
  ELEVENLABS_API_KEY:
    example: sk_...
    where_en: elevenlabs.io → API keys. Used when text-to-speech is set to elevenlabs.
    where_th: elevenlabs.io → API keys ใช้เมื่อตั้งอ่านออกเสียงเป็น elevenlabs
  HERMES_TIMEZONE:
    example: Asia/Bangkok
    where_en: An IANA timezone name. Prefer the Timezone field on the Time page unless you specifically want the env var to override config.yaml.
    where_th: ชื่อเขตเวลาแบบ IANA ควรใช้ช่องเขตเวลาในหน้าเวลามากกว่า เว้นแต่ตั้งใจให้ตัวแปรนี้ทับ config.yaml
